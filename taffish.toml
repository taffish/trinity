[package]
name = "trinity"
kind = "tool"
version = "2.16.5"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/trinity"

[command]
name = "taf-trinity"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/trinity:2.16.5-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["rna-seq", "transcriptomics", "de-novo-assembly", "transcript-assembly", "short-read"]
keywords = ["Trinity", "RNA-seq", "transcriptome assembly", "Inchworm", "Chrysalis", "Butterfly", "insilico normalization", "Salmon", "Jellyfish", "Bowtie2"]
description = "Trinity de novo RNA-seq assembly, in-silico normalization, and compatible Salmon 2.x final filtering."

[upstream]
name = "Trinity"
type = "github"
repo = "trinityrnaseq/trinityrnaseq"
homepage = "https://github.com/trinityrnaseq/trinityrnaseq/wiki"
manual = "https://github.com/trinityrnaseq/trinityrnaseq/wiki/Running-Trinity"
release_url = "https://github.com/trinityrnaseq/trinityrnaseq/releases/tag/Trinity-v2.16.5"
downloads = "https://github.com/trinityrnaseq/trinityrnaseq/releases/download/Trinity-v2.16.5/trinityrnaseq-v2.16.5.FULL.tar.gz"
version = "2.16.5"
license = "BSD-3-Clause with bundled third-party components including ParaFly, seqtk-trinity, Trimmomatic, collectl, bamsifter/htslib, and Ubuntu-packaged runtime tools"
commit = "98b3b95b15d5ed7efa8e3c1ce764674c12c81fb0"
citation = "Grabherr et al. 2011; Haas et al. 2013"
doi = "10.1038/nbt.1883; 10.1038/nprot.2013.084"
pmid = "21572440; 23845962"
watch = "tags"
strip_prefix = "Trinity-v"

[smoke]
backend = "docker"
timeout = 900
exist = ["Trinity", "TrinityStats.pl", "align_and_estimate_abundance.pl", "abundance_estimates_to_matrix.pl", "insilico_read_normalization.pl", "ParaFly", "seqtk-trinity", "inchworm", "Chrysalis", "QuantifyGraph", "GraphFromFasta", "ReadsToTranscripts", "bamsifter", "slclust", "collectl", "bowtie2", "bowtie2-build", "jellyfish", "samtools", "salmon", "blastn", "makeblastdb", "java", "perl", "python3", "bash", "gzip", "bzip2", "xz", "grep", "ldd", "sort", "sed", "awk", "cat", "mkdir", "rm", "cp", "mv", "touch", "head", "tail", "cut"]
test = ["python3 /usr/local/libexec/trinity-check.py identity", "python3 /usr/local/libexec/trinity-check.py help", "python3 /usr/local/libexec/trinity-check.py stats", "python3 /usr/local/libexec/trinity-check.py normalize", "python3 /usr/local/libexec/trinity-check.py assembly", "python3 /usr/local/libexec/trinity-check.py checkpoint", "python3 /usr/local/libexec/trinity-check.py matrix"]
